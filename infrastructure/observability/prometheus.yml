global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alert-rules.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: otel-collector        # application metrics arrive via OTLP -> collector -> this endpoint
    static_configs: [{ targets: ["otel-collector:8889"] }]
  # Infra exporters are optional but required for the db/redis/host/cert alerts to fire. Add them to the compose file:
  - { job_name: postgres,  static_configs: [{ targets: ["postgres-exporter:9187"] }] }
  - { job_name: redis,     static_configs: [{ targets: ["redis-exporter:9121"] }] }
  - { job_name: node,      static_configs: [{ targets: ["node-exporter:9100"] }] }   # also serves backup textfile metrics
  - job_name: blackbox-https
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: ["https://SET_ME.example.com/live"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }
