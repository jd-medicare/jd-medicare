# supabase/config.toml
# https://supabase.com/docs/guides/cli/config
project_id = "hzdtwpvwxjmgnhkjjicb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://jd-medicare.pages.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false           # Invite-only: users are created by admins, not self-registration
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false    # API manages user lifecycle; Supabase Auth email confirmations disabled

[functions]
verify_jwt = false              # Edge Functions verify JWT manually using the service role key

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
